<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Sul na Urna</title><style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@600&display=swap');:root{--ink:#0B1E3D;--blue:#1C5FD6;--paper:#F3F5FA;--muted:#5B6780;--line:#DEE3EE;--white:#fff;--danger:#B42318;--green:#19763B}*{box-sizing:border-box}body{margin:0;font-family:Inter,sans-serif;color:var(--ink);background:var(--paper)}button,input,select{font:inherit}.admin-shell{max-width:1180px;margin:0 auto;padding:30px 24px}.admin-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}.admin-head h1{font-family:Fraunces,serif;margin:0;font-size:30px}.admin-head p{margin:5px 0 0;color:var(--muted);font-size:13px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:18px}.login-card{max-width:460px;margin:70px auto}.field{margin-bottom:14px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:var(--muted)}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff}.btn{border:0;border-radius:8px;padding:10px 15px;font-weight:700;cursor:pointer;background:var(--ink);color:#fff}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:#fff;color:var(--danger);border:1px solid #F1C6C1}.btn.small{padding:7px 10px;font-size:12px}.notice{border-radius:8px;padding:12px 14px;font-size:13px;line-height:1.45;margin-bottom:16px;background:#EEF4FF;border:1px solid #C9DBFF;color:#214B91}.notice.demo{background:#FFF8E7;border-color:#F1D79C;color:#805A11}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tabs button{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:8px;padding:9px 13px;font-weight:700;cursor:pointer}.tabs button.active{background:var(--ink);color:#fff}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.toolbar h2{font-family:Fraunces,serif;font-size:22px;margin:0}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:9px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:10px 11px;border-bottom:1px solid var(--line);font-size:12.5px;vertical-align:middle}th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:#F8FAFD}.thumb{width:48px;height:36px;object-fit:cover;border-radius:5px;background:var(--paper)}.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--paper)}.actions{display:flex;gap:6px}.modal{position:fixed;inset:0;background:rgba(11,30,61,.48);display:none;align-items:center;justify-content:center;padding:20px;z-index:80}.modal.open{display:flex}.modal-card{background:#fff;border-radius:12px;width:min(680px,100%);max-height:90vh;overflow:auto;padding:22px}.modal-card h3{font-family:Fraunces,serif;margin:0 0 18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form-grid .full{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.hidden{display:none!important}.status{font-size:12px;color:var(--muted)}.message-cell{min-width:300px;max-width:460px;white-space:normal;line-height:1.45}.feedback-pill{display:inline-block;padding:4px 7px;border-radius:999px;font-size:11px;font-weight:700;background:#EEF4FF;color:#214B91}.feedback-pill.em_analise{background:#FFF8E7;color:#805A11}.feedback-pill.resolvida{background:#EAF7EE;color:var(--green)}@media(max-width:700px){.admin-shell{padding:20px 14px}.admin-head{align-items:flex-start;flex-direction:column}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}}

</style></head><body><div class="admin-shell"><div id="loginView" class="card login-card"><h1 style="font-family:Fraunces,serif;margin-top:0">Sul na Urna</h1><p style="color:#5B6780">Painel administrativo</p><div id="modeNotice"></div><form id="loginForm"><div class="field"><label>E-mail</label><input type="email" id="email" autocomplete="username" required></div><div class="field"><label>Senha</label><input type="password" id="password" autocomplete="current-password" required></div><button class="btn" type="submit">Entrar</button><span class="status" id="loginStatus"></span></form><button id="demoEnter" class="btn secondary hidden" type="button">Entrar no modo demonstração</button></div><div id="appView" class="hidden"><div class="admin-head"><div><h1>Admin Sul na Urna</h1><p>Gerencie candidatos, matérias, banners e as correções enviadas pelos leitores sem editar o código da página.</p></div><div><button class="btn secondary" id="openSite">Ver página pública</button> <button class="btn secondary" id="logout">Sair</button></div></div><div id="appNotice"></div><div class="tabs"><button class="active" data-tab="candidates">Candidatos</button><button data-tab="articles">Matérias</button><button data-tab="banners">Banners</button><button data-tab="feedback">Correções</button></div><div class="card"><div class="toolbar"><h2 id="sectionTitle">Candidatos</h2><button class="btn" id="newItem">+ Adicionar</button></div><div class="table-wrap"><table><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table></div></div></div></div><div class="modal" id="modal"><div class="modal-card"><h3 id="modalTitle">Editar</h3><form id="editForm"><div id="formFields" class="form-grid"></div><div class="modal-actions"><button type="button" class="btn secondary" id="cancelModal">Cancelar</button><button type="submit" class="btn">Salvar</button></div></form></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../data/seed-data.js"></script><script src="../js/data-service.js"></script><script src="admin.js"></script></body></html>
