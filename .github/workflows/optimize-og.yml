name: Optimize social preview

on:
  push:
    paths:
      - ".github/workflows/optimize-og.yml"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow
      - name: Build optimized Open Graph image
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps
          src = "assets/og-sul-na-urna.jfif"
          dst = "assets/og-sul-na-urna-social.jpg"
          im = Image.open(src).convert("RGB")
          im = ImageOps.fit(im, (1200, 630), method=Image.Resampling.LANCZOS, centering=(0.5,0.5))
          im.save(dst, "JPEG", quality=82, optimize=True, progressive=True)
          print(dst)
          PY
      - name: Commit optimized image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/og-sul-na-urna-social.jpg
          git diff --cached --quiet && exit 0
          git commit -m "Otimiza miniatura social"
          git push
